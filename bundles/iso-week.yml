css: |
  /* Shared Seelen 2.8.3 tokens; no fixed palette. Stable classes are themeable. */
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; font-family: var(--font-family, "Segoe UI", sans-serif); color: var(--slu-std-fg-color, CanvasText); }
  #root { width: max-content; overflow: hidden; }
  .time-popup.slu-std-popover {
    width: 390px; padding: 18px; margin: 10px; max-height: 700px; overflow: auto;
    color: var(--slu-std-fg-color, CanvasText); background: var(--slu-std-bg-color, Canvas);
    border: 1px solid var(--color-gray-300, ButtonBorder); border-radius: 14px;
    box-shadow: var(--shadow-m, none); font-size: 13px; line-height: 1.45;
  }
  header, nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  h2 { font-size: 13px; margin: 0; font-weight: 600; }
  p { margin: 4px 0; }
  .current-week { font-size: 23px; font-weight: 650; margin-top: 14px; }
  .subtle, .footnote { color: var(--slu-std-fg-secondary-color, GrayText); font-size: 11px; }
  .footnote { margin-top: 14px; }
  nav { margin: 16px 0 10px; }
  button { font: inherit; color: inherit; background: var(--slu-std-bg-light-color, ButtonFace); border: 1px solid var(--color-gray-300, ButtonBorder); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: var(--slu-std-ui-hover-overlay, ButtonFace); }
  button:focus-visible { outline: 2px solid var(--system-accent-color, Highlight); outline-offset: 2px; }
  table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 2px 4px; text-align: center; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  th { font-size: 10px; font-weight: 600; }
  td { height: 31px; border-radius: 6px; }
  .week-number { color: var(--slu-std-ui-color, LinkText); }
  .outside-month { color: var(--slu-std-fg-muted-color, GrayText); }
  .current-week-row { background: var(--slu-std-ui-hover-overlay, ButtonFace); }
  .today { outline: 2px solid var(--system-accent-color, Highlight); outline-offset: -2px; font-weight: 750; }
  .clock-list { margin-top: 12px; }
  .clock-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-gray-300, ButtonBorder); }
  .clock-row h2 { overflow-wrap: anywhere; }
  .clock-row:last-child { border-bottom: 0; }
  .clock-value { text-align: right; font-variant-numeric: tabular-nums; }
  .clock-value time { font-size: 20px; font-weight: 600; white-space: nowrap; }
plugins:
  - id: '@nicolas/tb-iso-week'
    metadata:
      displayName: Semaine ISO
      description: Ouvrir le calendrier avec numéros de semaine ISO.
      tags:
        - toolbar
        - clock
        - calendar
      appTargetVersion:
        - 2
        - 8
        - 3
    icon: FaCalendar
    target: '@seelen/fancy-toolbar'
    plugin:
      scopes:
        - Date
      tooltip: return "Semaine ISO · ouvrir le calendrier";
      template: |
        // Date scope triggers a refresh; never parse the localized date string.
        const tick = date;
        function isoWeek(value) {
          const d = new Date(Date.UTC(value.getFullYear(), value.getMonth(), value.getDate()));
          d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
          const year = d.getUTCFullYear();
          return { year, week: Math.ceil(((d - new Date(Date.UTC(year, 0, 1))) / 86400000 + 1) / 7) };
        }
        function weekLabel(week, format = 'Sxx') {
          return format.replace(/xx|x/, format.includes('xx') ? String(week).padStart(2, '0') : String(week));
        }
        const now = new Date();
        const civilDate = String(now.getDate()).padStart(2, "0") + "/" + String(now.getMonth() + 1).padStart(2, "0") + "/" + now.getFullYear();
        return weekLabel(isoWeek(now).week, "Sxx") + " · " + civilDate;
      onClickV2: trigger("@nicolas/iso-week-popup");
